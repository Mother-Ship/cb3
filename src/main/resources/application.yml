spring:
  application:
    name: cb3
  profiles:
    active: dev
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    cache: false  # 开发环境关闭缓存
    prefix: classpath:/templates/
    suffix: .html
server:
  port: 12450
app:
  cache-path: "./cache"
  max-cache-cover-size: 1000
  pp-calc-url: "http://192.168.4.34:5000"
  # osu! API 限流（次/分钟），取值依据见 OsuRateLimiter 注释与线上实测
  osu-api-v1-rate-per-minute: 600
  osu-api-v2-rate-per-minute: 1100
  osu-api-token-rate-per-minute: 60

